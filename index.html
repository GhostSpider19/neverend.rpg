<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mythbound RPG</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: #1a1a24;
            --accent-gold: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.4);
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* UI Screens */
        .screen { display: none; flex-direction: column; height: 100%; width: 100%; padding: 20px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* Typography & Inputs */
        h1, h2 { color: var(--accent-gold); text-align: center; margin-bottom: 20px; font-weight: normal; letter-spacing: 1px; }
        input, select, button {
            background: var(--panel-bg); color: var(--text-main);
            border: 1px solid #333; padding: 12px; border-radius: 8px;
            font-size: 16px; margin-bottom: 15px; width: 100%;
        }
        button {
            background: linear-gradient(145deg, #2a2a35, #1a1a24);
            color: var(--accent-gold); border: 1px solid var(--accent-gold);
            cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.2s;
        }
        button:active { transform: scale(0.98); box-shadow: 0 0 10px var(--accent-glow); }

        /* Home Screen */
        .character-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .character-card {
            background: var(--panel-bg); border-radius: 12px; padding: 10px;
            text-align: center; border: 1px solid #333; cursor: pointer;
        }
        .character-card img {
            width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover;
            border: 2px solid #222; margin-bottom: 10px;
        }
        .character-card h3 { color: var(--accent-gold); font-size: 16px; }
        .character-card p { color: var(--text-muted); font-size: 12px; }

        /* Character Creator */
        .avatar-preview {
            width: 150px; height: 150px; margin: 0 auto 20px; border-radius: 50%;
            border: 3px solid var(--accent-gold); background: #222; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }

        /* Game Interface */
        #game-header {
            display: flex; align-items: center; gap: 15px; padding-bottom: 15px;
            border-bottom: 1px solid #333; margin-bottom: 15px;
        }
        #game-header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent-gold); }
        #chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
        
        .message { padding: 12px 16px; border-radius: 12px; max-width: 90%; line-height: 1.5; }
        .message.dm { background: var(--panel-bg); align-self: flex-start; border-left: 3px solid var(--accent-gold); }
        .message.player { background: #222b36; align-self: flex-end; border-right: 3px solid #4a90e2; }
        .message img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #444; }

        /* Action Bar */
        .action-bar { display: flex; gap: 10px; margin-bottom: 10px; }
        .action-bar button { margin: 0; padding: 10px; font-size: 14px; flex: 1; }
        .action-bar button.active { background: var(--accent-gold); color: #000; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { margin: 0; flex: 1; }
        .input-area button { width: auto; padding: 0 20px; margin: 0; }

        /* Settings Modal */
        #settings-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; width: auto; font-size: 24px; box-shadow: none; color: var(--text-muted); }
    </style>
</head>
<body>

    <button id="settings-btn" onclick="toggleSettings()">⚙️</button>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen active">
        <h1>Mythbound</h1>
        <div class="character-grid" id="roster"></div>
        <button onclick="nav('screen-create')">+ Create New Character</button>
    </div>

    <!-- CREATE CHARACTER SCREEN -->
    <div id="screen-create" class="screen">
        <h2>Forge Your Hero</h2>
        <div class="avatar-preview" id="avatar-container">
            <span style="color:#555; text-align:center; font-size:12px;">Generate<br>Avatar</span>
        </div>
        
        <select id="char-race">
            <option value="Human">Human</option>
            <option value="Elf">Elf</option>
            <option value="Dwarf">Dwarf</option>
            <option value="Halfling">Halfling</option>
            <option value="Tiefling">Tiefling</option>
            <option value="Orc">Orc</option>
        </select>
        
        <select id="char-gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Androgynous">Androgynous</option>
        </select>

        <button onclick="generateAvatar()" style="background: transparent; border-style: dashed;">🎨 Generate Portrait</button>
        
        <input type="text" id="char-name" placeholder="Character Name" maxlength="20">
        
        <button onclick="goToStorySelect()">Next ➔</button>
        <button onclick="nav('screen-home')" style="border-color: #444; color: #888;">Cancel</button>
    </div>

    <!-- STORY SELECT SCREEN -->
    <div id="screen-story" class="screen">
        <h2>Choose Your Path</h2>
        <div style="display:flex; flex-direction:column; gap:15px;" id="story-list">
            <button onclick="startAdventure('The Whispering Woods', 'A dark forest where travelers vanish. You seek the lost elven ruins within.')">🌲 The Whispering Woods</button>
            <button onclick="startAdventure('Shadow of the Dragon', 'A mountain town is terrorized by a drake. You arrived looking for bounties.')">🐉 Shadow of the Dragon</button>
            <button onclick="startAdventure('The Sunken Citadel', 'An ancient fortress swallowed by the earth, rumored to hold a magical artifact.')">🏰 The Sunken Citadel</button>
        </div>
        <button onclick="nav('screen-home')" style="border-color: #444; color: #888; margin-top:20px;">Back</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen">
        <div id="game-header">
            <img id="active-avatar" src="" alt="Avatar">
            <div>
                <h3 id="active-name" style="color:var(--accent-gold); margin-bottom:4px;">Name</h3>
                <p id="active-desc" style="color:var(--text-muted); font-size:12px;">Level 1</p>
            </div>
            <button onclick="nav('screen-home')" style="margin:0; margin-left:auto; width:auto; padding:5px 15px; font-size:12px;">Quit</button>
        </div>

        <div id="chat-log"></div>

        <div style="margin-top: auto; padding-top: 10px;">
            <div class="action-bar">
                <button id="btn-do" class="active" onclick="setAction('Do')">Do</button>
                <button id="btn-say" onclick="setAction('Say')">Say</button>
                <button id="btn-use" onclick="setAction('Use')">Use</button>
            </div>
            <div class="input-area">
                <input type="text" id="action-input" placeholder="What do you do?">
                <button onclick="sendAction()">Roll</button>
            </div>
        </div>
    </div>

    <script>
        // --- STATE MANAGEMENT ---
        let saves = JSON.parse(localStorage.getItem('mythbound_saves')) || [];
        let activeCharId = null;
        let activeAction = 'Do';
        let tempAvatar = "";

        // --- NAVIGATION ---
        function nav(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if(screenId === 'screen-home') renderHome();
        }

        // --- HOME SCREEN ---
        function renderHome() {
            const roster = document.getElementById('roster');
            roster.innerHTML = '';
            saves.forEach(char => {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.innerHTML = `
                    <img src="${char.avatar}">
                    <h3>${char.name}</h3>
                    <p>${char.race} • ${char.storyName}</p>
                `;
                card.onclick = () => loadAdventure(char.id);
                roster.appendChild(card);
            });
        }

        // --- CHARACTER CREATION ---
        function generateAvatar() {
            const race = document.getElementById('char-race').value;
            const gender = document.getElementById('char-gender').value;
            const prompt = encodeURIComponent(`Realistic fantasy portrait concept art of a ${gender} ${race} adventurer, intricate details, dark moody lighting, Dungeons and Dragons character art, high resolution`);
            const url = `https://image.pollinations.ai/prompt/${prompt}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random()*1000)}`;
            
            document.getElementById('avatar-container').innerHTML = `<img src="${url}">`;
            tempAvatar = url;
        }

        function goToStorySelect() {
            if(!document.getElementById('char-name').value || !tempAvatar) return alert('Generate an avatar and enter a name!');
            nav('screen-story');
        }

        function startAdventure(storyName, context) {
            const newChar = {
                id: Date.now().toString(),
                name: document.getElementById('char-name').value,
                race: document.getElementById('char-race').value,
                gender: document.getElementById('char-gender').value,
                avatar: tempAvatar,
                storyName: storyName,
                context: context,
                history: []
            };
            saves.push(newChar);
            saveData();
            loadAdventure(newChar.id);
        }

        // --- GAMEPLAY ---
        function loadAdventure(id) {
            activeCharId = id;
            const char = saves.find(c => c.id === id);
            
            document.getElementById('active-avatar').src = char.avatar;
            document.getElementById('active-name').innerText = char.name;
            document.getElementById('active-desc').innerText = `${char.gender} ${char.race} • ${char.storyName}`;
            
            const log = document.getElementById('chat-log');
            log.innerHTML = '';
            
            if (char.history.length === 0) {
                const initMsg = `Welcome to **${char.storyName}**.\n\n${char.context}\n\nWhat do you do?`;
                addMessage(initMsg, 'dm');
                char.history.push({role: 'dm', text: initMsg});
                saveData();
            } else {
                char.history.forEach(msg => addMessage(msg.text, msg.role));
            }
            
            nav('screen-game');
        }

        function setAction(type) {
            activeAction = type;
            document.querySelectorAll('.action-bar button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${type.toLowerCase()}`).classList.add('active');
            document.getElementById('action-input').placeholder = type === 'Do' ? 'What do you do?' : type === 'Say' ? 'What do you say?' : 'What do you use?';
        }

        async function sendAction() {
            const inputEl = document.getElementById('action-input');
            const text = inputEl.value.trim();
            if(!text) return;
            
            const fullAction = `[${activeAction}] ${text}`;
            addMessage(fullAction, 'player');
            inputEl.value = '';
            
            const char = saves.find(c => c.id === activeCharId);
            char.history.push({role: 'player', text: fullAction});
            
            // Show typing indicator
            const typingId = Date.now();
            const log = document.getElementById('chat-log');
            log.innerHTML += `<div id="typing-${typingId}" class="message dm" style="color:var(--text-muted)">The Dungeon Master is thinking...</div>`;
            log.scrollTop = log.scrollHeight;

            // Generate AI Response (Simulated here if no API key, replace with fetch to Gemini in production)
            const apiKey = localStorage.getItem('mythbound_key');
            let dmReply = "";
            let sceneImageUrl = "";

            if (!apiKey) {
                dmReply = `*You attempt to ${text.toLowerCase()}.* You roll a d20 and get a ${Math.floor(Math.random()*20)+1}. The environment reacts accordingly. What is your next move?`;
            } else {
                dmReply = await fetchGeminiResponse(char.history, apiKey);
                // Simple keyword trigger for generating an environment image occasionally
                if(Math.random() > 0.6) {
                    const scenePrompt = encodeURIComponent(`Realistic fantasy environment concept art, ${char.storyName}, dark fantasy, epic lighting`);
                    sceneImageUrl = `https://image.pollinations.ai/prompt/${scenePrompt}?width=800&height=400&nologo=true&seed=${Math.floor(Math.random()*1000)}`;
                }
            }

            document.getElementById(`typing-${typingId}`).remove();
            
            if(sceneImageUrl) {
                dmReply += `\n<img src="${sceneImageUrl}" alt="Scene visualization">`;
            }

            addMessage(dmReply, 'dm');
            char.history.push({role: 'dm', text: dmReply});
            saveData();
        }

        function addMessage(text, role) {
            const log = document.getElementById('chat-log');
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            // Convert simple markdown to HTML (bold)
            msg.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
            log.appendChild(msg);
            log.scrollTop = log.scrollHeight;
        }

        // --- UTILS ---
        function saveData() { localStorage.setItem('mythbound_saves', JSON.stringify(saves)); }
        
        function toggleSettings() {
            const current = localStorage.getItem('mythbound_key') || '';
            const key = prompt('Enter Gemini API Key for AI generation (Leave blank for offline dice mode):', current);
            if(key !== null) localStorage.setItem('mythbound_key', key.trim());
        }

        // Basic Gemini API call structure for BYOK
        async function fetchGeminiResponse(history, key) {
            try {
                const systemPrompt = "You are a D&D Dungeon Master. Keep responses under 3 paragraphs. Describe the outcome of the player's action, ask for a d20 roll if it's difficult, and ask what they do next.";
                const msgs = history.map(h => ({ role: h.role === 'dm' ? 'model' : 'user', parts: [{text: h.text}] }));
                msgs.unshift({ role: 'user', parts: [{text: systemPrompt}] });
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: msgs })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                return "The magic connection fizzled. (Check your API key in settings).";
            }
        }

        // Init
        renderHome();
    </script>
</body>
</html>
